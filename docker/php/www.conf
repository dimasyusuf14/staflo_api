[www]
user = www
group = www

listen = 0.0.0.0:9000
listen.owner = www
listen.group = www

; Process manager
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging
access.log = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/html/storage/logs/php-fpm.log

; Security
security.limit_extensions = .php
